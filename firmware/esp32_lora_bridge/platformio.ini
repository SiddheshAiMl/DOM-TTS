; PlatformIO Project Configuration File for iTantra ESP32 LoRa Bridge
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nodeA
src_dir = src_pio

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
build_flags =
    -DCORE_DEBUG_LEVEL=3

; Node A on COM6 (MAC: 00:70:07:83:cd:14 -> BLE: iTantra-Node-CD14)
[env:nodeA]
upload_port = COM6
monitor_port = COM6

; Node B on COM7 (MAC: 00:70:07:84:dd:00 -> BLE: iTantra-Node-DD00)
[env:nodeB]
upload_port = COM7
monitor_port = COM7

; Fallback default environment
[env:esp32dev]
upload_port = COM6
monitor_port = COM6
